<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather & Air Quality Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-container">
        <header>
            <h1>🌤️ Weather Dashboard</h1>
            <p>Check real-time weather information</p>
        </header>

        <!-- Search Section -->
        <section class="search-section">
            <input type="text" id="city-input" placeholder="Enter city name (e.g. London, Delhi)...">
            <button id="search-btn">Search</button>
        </section>

        <!-- Weather Display Card -->
        <section id="weather-card" class="weather-card hidden">
            <h2 id="city-name">--</h2>
            <div class="temp-box">
                <span id="temperature">--</span>°C
            </div>
            <p id="weather-desc">--</p>

            <div class="details-grid">
                <div class="detail-item">
                    <span>Wind Speed</span>
                    <strong id="wind-speed">-- km/h</strong>
                </div>
                <div class="detail-item">
                    <span>Coordinates</span>
                    <strong id="coords">--</strong>
                </div>
            </div>
        </section>

        <!-- Error Message -->
        <p id="error-msg" class="error-msg hidden"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
